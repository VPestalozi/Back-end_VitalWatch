services:
  database:
    image: timescale/timescaledb:latest-pg16
    container_name: vitalwatch_db
    restart: always
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=vitalpass
      - POSTGRES_DB=vitalwatch
    ports:
      - "5432:5432"
    volumes:
      - ./init-db:/docker-entrypoint-initdb.d
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: